#config_version=6

mode:
  start_events: start_mode_bumpers
  stop_events: stop_mode_bumpers
  priority: 200

shots:
  sling_left:
    switches: s_sling_left
  sling_right:
    switches: s_sling_right
  bumper_lower:
    switches: s_bumper_lower
  bumper_upper:
    switches: s_bumper_upper
  inlane_left:
    switches: s_inlane_left
  inlane_right_1:
    switches: s_inlane_right_1
  inlane_right_2:
    switches: s_inlane_right_2

shot_groups:
  slings:
    shots: sling_left, sling_right
  bumpers:
    shots: bumper_lower, bumper_upper
  inlanes:
    shots: inlane_left, inlane_right_1, inlane_right_2

variable_player:
  slings_hit:
    initial_value: 0
    score: 1_000
  bumpers_hit:
    initial_value: 0
    score: 10_000
  inlanes_hit:
    initial_value: 0
    score: 10