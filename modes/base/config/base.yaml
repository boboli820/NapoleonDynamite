#config_version=6

# This is the Base Mode that starts at the beginning of each ball
# and stops at the end of each ball.

mode:
  start_events: ball_starting
  stop_events: ball_will_end
  priority: 100

event_player:
  mode_base_started:
  - start_mode_bumpers
  mode_base_will_stop:
  - stop_mode_bumpers
#  left_lane_hit: start_mode_hurryup

sound_player:
  mode_base_started:
    heres_rico:
      bus: music
      loops: -1

slide_player:
  mode_base_started: base_slide

